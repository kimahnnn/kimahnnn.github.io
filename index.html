<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김안의 프로필</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #fff9fb; /* 배경색: 아주 연한 핑크 */
            color: #333;
            padding: 20px 0;
        }
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.2);
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            object-fit: contain; /* 밈 이미지 전체가 잘 보이게 */
            margin-bottom: 10px;
        }
        h1 { 
            color: #ff748c; 
            font-size: 24px; 
            margin-bottom: 15px;
            font-weight: 700;
        }
        p { 
            line-height: 1.8; 
            font-size: 15px; 
            color: #555;
            word-break: keep-all; /* 한글 줄바꿈 예쁘게 */
            text-align: left; /* 모집 내용이 잘 보이게 왼쪽 정렬 */
            padding: 0 10px;
        }
        b { color: #d81b60; }
        .insta-btn {
            display: inline-block;
            margin-top: 25px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(220, 39, 67, 0.3);
        }
        .insta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 39, 67, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="meme.png" alt="cute meme" class="profile-img">

        <h1>안녕하세요!</h1>
        <p>
            저희 팀과 함께할 새 멤버를 찾고 있습니다. ✨<br><br>
            🤝 <b>이런 분을 찾아요:</b><br>
            - 소통이 원활하고 화목한 분위기를 좋아하시는 분<br>
            - 책임감이 강하고 함께 성장하고 싶으신 분<br><br>
            저와 즐겁게 활동하고 싶다면 언제든 연락주세요~
        </p>
        
        <a href="https://instagram.com/kimahnnn" class="insta-btn" target="_blank">
            Instagram @kimahnnn 📸
        </a>
    </div>

</body>
</html>
