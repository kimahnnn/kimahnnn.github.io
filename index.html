<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김안의 프로필</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fff9fb; /* 배경색: 아주 연한 핑크 */
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.2);
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        .emoji {
            font-size: 50px;
            margin-bottom: 10px;
        }
        h1 { 
            color: #ff748c; 
            font-size: 26px; 
            margin-bottom: 15px;
            font-weight: 700;
        }
        p { 
            line-height: 1.8; 
            font-size: 16px; 
            color: #555;
            word-break: keep-all; /* 한글 줄바꿈 예쁘게 */
        }
        .insta-btn {
            display: inline-block;
            margin-top: 25px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(220, 39, 67, 0.3);
        }
        .insta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 39, 67, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji">✨</div>
        <h1>안녕하세요, 김안입니다</h1>
        <p>친절하고 화목한 친구들과 함께 일하는 것을 정말 좋아해요. 우리 친하게 지내요! 😊</p>
        
        <a href="https://instagram.com/kimahnnn" class="insta-btn" target="_blank">
            Instagram @kimahnnn 📸
        </a>
    </div>

</body>
</html>
